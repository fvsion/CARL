# GGUF model registry for the llama.cpp preset (host/serve-llama.sh, host/models.sh).
# One model per line, '|'-separated:
#   name | hf repo | pinned revision | file | sha256 | bytes | served alias | default SPEC[:draft n] | notes
# Revisions and sha256 come from the Hugging Face API; downloads are verified
# against them. Every entry has an MTP (nextn) head in the file (checked from
# the GGUF headers 2026-10-01) and defaults to MTP+ngram speculation.
# Q3/IQ3 entries reuse their Q4 sibling's served alias, so client configs need no
# extra model entry (the monitor shows which file is loaded).
# The first line is the default model. When it doesn't fit this Mac's GPU memory
# (e.g. 24 GB Macs), the launcher uses the small-Mac default named below instead.
# `./host/serve.sh fit` shows what fits this Mac and which default it gets.
# default-small: qwen3.6-35b-a3b-iq3
